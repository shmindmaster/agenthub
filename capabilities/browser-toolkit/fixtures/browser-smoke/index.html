<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Synthetic local page for validating the shared browser quality toolkit.">
    <title>Browser Toolkit Smoke</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
      main { width: min(32rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid GrayText; border-radius: 1rem; }
      label, input, button { display: block; width: 100%; box-sizing: border-box; }
      input, button { margin-top: .5rem; padding: .75rem; font: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 3px solid Highlight; outline-offset: 3px; }
      #status { min-height: 1.5rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Controlled browser smoke</h1>
      <form id="smoke-form">
        <label for="name">Synthetic name</label>
        <input id="name" name="name" autocomplete="off" required>
        <button type="submit">Submit synthetic form</button>
      </form>
      <p id="status" role="status" aria-live="polite">Ready</p>
    </main>
    <script>
      console.info("browser-toolkit-smoke-ready");
      document.querySelector("#smoke-form").addEventListener("submit", async event => {
        event.preventDefault();
        const name = new FormData(event.currentTarget).get("name");
        const response = await fetch("/api/submit", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name })
        });
        if (!response.ok) throw new Error(`submit failed: ${response.status}`);
        const result = await response.json();
        document.querySelector("#status").textContent = `Submitted: ${result.name}`;
      });
    </script>
  </body>
</html>
