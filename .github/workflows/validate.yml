name: Windows validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: ${{ matrix.shell }}
        run: Install-Module Pester -Scope CurrentUser -Force -MinimumVersion 5.6.1
      - name: Run repository-safe tests
        shell: ${{ matrix.shell }}
        run: |
          $result = Invoke-Pester -Path .\tests\AgentCtlReadOnly.Tests.ps1, .\tests\AdvertisedValidationCommands.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester tests failed" }
          .\tests\Validate-AgentEcosystem.ps1
      - name: Validate declarative files and secret exclusions
        shell: ${{ matrix.shell }}
        run: |
          Get-ChildItem .\registry, .\profiles -Filter *.json -File -Recurse | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }
          $forbidden = @(Get-ChildItem -File -Force -Recurse | Where-Object {
            $_.Name -match '^(\.env|auth\.json|secrets?\.json|credentials?\.json)$' -or
            $_.FullName -match '\\(reports|state\\cross-agent)\\(?!README\.md$)'
          })
          if ($forbidden.Count) { throw "Forbidden runtime or secret-state files are tracked: $($forbidden.FullName -join ', ')" }
