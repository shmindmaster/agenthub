name: Windows validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -Scope CurrentUser -Force -RequiredVersion 5.6.1
      - name: Run repository-safe tests
        shell: powershell
        run: |
          $result = Invoke-Pester -Path .\tests\AgentCtlReadOnly.Tests.ps1, .\tests\AdvertisedValidationCommands.Tests.ps1, .\tests\CursorReadiness.Tests.ps1, .\tests\PathSafety.Tests.ps1, .\tests\RuntimeCentralization.Tests.ps1, .\tests\StaleWorktreeReaper.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester tests failed" }
          .\tests\Validate-AgentEcosystem.ps1
      - name: Validate declarative files and secret exclusions
        shell: powershell
        run: .\.github\workflows\validate-repository.ps1

  powershell-7:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -RequiredVersion 5.6.1
      - name: Run repository-safe tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path .\tests\AgentCtlReadOnly.Tests.ps1, .\tests\AdvertisedValidationCommands.Tests.ps1, .\tests\CursorReadiness.Tests.ps1, .\tests\PathSafety.Tests.ps1, .\tests\RuntimeCentralization.Tests.ps1, .\tests\StaleWorktreeReaper.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester tests failed" }
          .\tests\Validate-AgentEcosystem.ps1
      - name: Validate declarative files and secret exclusions
        shell: pwsh
        run: .\.github\workflows\validate-repository.ps1
