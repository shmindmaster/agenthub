name: Validate public core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0

      - name: Verify npm distribution surface
        shell: pwsh
        run: npm run verify:package

      - name: Validate Media Studio dependency surface
        shell: pwsh
        working-directory: packages/media-studio/kit
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run lint
          npm run build

      - name: Validate mobile smoke dependency surface
        shell: pwsh
        working-directory: packages/mobile-development/fixtures/smoke-app
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: Validate registry and packages
        shell: pwsh
        run: ./scripts/Validate-AgentHub.ps1

      - name: Run public-core test suite
        shell: pwsh
        run: pwsh -NoProfile -File tests/Run-AllTests.ps1

  minimum-node:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 18.x

      - name: Verify the Node 18 distribution contract
        shell: pwsh
        run: |
          npm run verify:package
          node --check scripts/agenthub-cli.mjs
          node --check scripts/Repair-QwenCodeMcpOAuth.js
          node --check scripts/Test-McpOAuthReachability.js
