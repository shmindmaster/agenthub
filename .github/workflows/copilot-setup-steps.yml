name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    # Copilot agent sessions will run on a self-hosted Ubuntu x64 runner
    # registered with the custom labels "copilot" and repo-specific runner label.
    runs-on: [self-hosted, Linux, X64, copilot, sh-runner-agenthub]
    timeout-minutes: 59

    permissions:
      contents: read

    steps:
      - name: Verify runner environment
        shell: bash
        run: |
          echo "Using self-hosted Copilot runner: $(hostname)"
          uname -a
