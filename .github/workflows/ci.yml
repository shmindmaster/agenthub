name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.plan.outputs.core }}
      doctor: ${{ steps.plan.outputs.doctor }}
      docs: ${{ steps.plan.outputs.docs }}
      packages: ${{ steps.plan.outputs.packages }}
      package_matrix: ${{ steps.plan.outputs.package_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test change classifier
        run: node --test scripts/ci-plan.test.mjs
      - name: Check public repository privacy
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/Test-PublicRepoPrivacy.ps1
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: Validate registry and hashes
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/AgentHub.ps1 validate
      - id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-plan.mjs

  core:
    needs: plan
    if: needs.plan.outputs.core == 'true'
    name: Shared contracts (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ripgrep ;;
            macOS) HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
          npm install -g @anthropic-ai/claude-code@2.1.310
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/kit-tsc" typescript@5.9.3 @types/node@24.10.1
          echo "EXECUTION_CONTROLS_TSC=$RUNNER_TEMP/kit-tsc/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
          echo "EXECUTION_CONTROLS_TYPE_ROOTS=$RUNNER_TEMP/kit-tsc/node_modules/@types" >> "$GITHUB_ENV"
      - name: Sync audit against a synthetic profile
        if: matrix.shard == 0
        shell: pwsh
        run: |
          $profileDir = Join-Path $env:RUNNER_TEMP 'agenthub-synthetic-profile'
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          pwsh -NoProfile -File ./scripts/AgentHub.ps1 sync -UserProfile $profileDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run shared contract tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/Run-AllTests.ps1 -SkipListPath tests/ci-skip.json -Scope core -Shard ${{ matrix.shard }} -Shards 4

  package:
    needs: plan
    if: needs.plan.outputs.packages == 'true'
    name: Package (${{ matrix.package }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        shell: bash
        env:
          CI_PACKAGE_NAME: ${{ matrix.package }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ripgrep
          if [ "$CI_PACKAGE_NAME" = media-studio ]; then sudo apt-get install -y -q ffmpeg; fi
          npm install -g @anthropic-ai/claude-code@2.1.310
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/kit-tsc" typescript@5.9.3 @types/node@24.10.1
          echo "EXECUTION_CONTROLS_TSC=$RUNNER_TEMP/kit-tsc/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
          echo "EXECUTION_CONTROLS_TYPE_ROOTS=$RUNNER_TEMP/kit-tsc/node_modules/@types" >> "$GITHUB_ENV"
      - name: Run package and shared plugin tests
        shell: pwsh
        env:
          CI_PACKAGE: ${{ matrix.package }}
        run: pwsh -NoProfile -File ./tests/Run-AllTests.ps1 -SkipListPath tests/ci-skip.json -Scope package -Package $env:CI_PACKAGE -Shard ${{ matrix.shard }} -Shards ${{ matrix.shards }}

  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: Run documentation contracts
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/Run-AllTests.ps1 -SkipListPath tests/ci-skip.json -Scope docs

  doctor:
    needs: plan
    if: needs.plan.outputs.doctor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run typecheck
      - run: node --test test/doctor/*.test.mjs
      - run: node scripts/agenthub-cli.mjs doctor --no-registry --all
      - run: npm pack --dry-run
