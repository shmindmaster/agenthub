name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The sync engine and its full PowerShell suite on every OS coding agents
  # run on. tests/ci-skip.json lists the only exclusions, each with its reason:
  # tests that read the owner's machine, and Windows-host features on macOS/Linux.
  powershell-tests:
    name: PowerShell suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ripgrep and ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ripgrep ffmpeg ;;
            macOS) HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet ripgrep ffmpeg ;;
            Windows) choco install ripgrep ffmpeg -y --no-progress ;;
          esac

      - name: Install the Claude Code CLI (plugin schema validator)
        run: npm install -g @anthropic-ai/claude-code@2.1.310

      - name: Validate registry
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/AgentHub.ps1 validate

      - name: Sync audit against a synthetic profile
        shell: pwsh
        run: |
          $profileDir = Join-Path $env:RUNNER_TEMP 'agenthub-synthetic-profile'
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          pwsh -NoProfile -File ./scripts/AgentHub.ps1 sync -UserProfile $profileDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/Run-AllTests.ps1 -SkipListPath tests/ci-skip.json

