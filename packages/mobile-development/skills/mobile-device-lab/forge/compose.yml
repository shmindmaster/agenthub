services:
  macos:
    image: dockurr/macos:3.12
    container_name: macos
    environment:
      VERSION: "15"
      RAM_SIZE: "32G"
      CPU_CORES: "16"
      CPU_FLAGS: "+invtsc"
      HOST: "forge-mac"
      DISK_SIZE: "180G"
      USER_PORTS: "22"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add: [NET_ADMIN]
    ports:
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:2222:22"
    volumes:
      - /opt/macos/storage:/storage
      - /opt/macos/boot.sh:/run/boot.sh:ro
    restart: "no"
    stop_grace_period: 2m
