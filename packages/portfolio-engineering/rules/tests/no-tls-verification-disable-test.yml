id: no-tls-verification-disable
valid:
  - process.env.NODE_ENV = 'test'
  - process.env.NODE_TLS_REJECT_UNAUTHORIZED = '1'
  - const note = "process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'"
invalid:
  - process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
  - process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
