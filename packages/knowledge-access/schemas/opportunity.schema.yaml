# Normalized opportunity. Produced by parse-opportunity. No client name
# is required; Upwork posts may leave org undisclosed.
kind: job | upwork | rfp | client_brief
org: string | null
industry: string | null
engagement_shape: fulltime | contract_hourly | contract_fixed | advisory
requirements:
  - text: string
    type: hard | preferred | implied
    capability: string   # join key into engagement records
budget_signal: string | null
timeline: string | null
decision_criteria: [string]
tone: formal | startup | agency
gaps_to_preempt: [string]
source_path: string | null
parsed_at: string        # ISO-8601
